<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmação de presença</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f4ef;--card:rgba(255,255,255,.95);--text:#292522;--muted:#77706a;--accent:#b96f7b;--accent-dark:#965561;--line:#e8ded6}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 10%,rgba(185,111,123,.14),transparent 28%),radial-gradient(circle at 90% 80%,rgba(219,184,143,.16),transparent 30%),var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;padding:24px 14px}.page{width:100%;max-width:560px;margin:0 auto}.card{background:var(--card);border-radius:28px;overflow:hidden;box-shadow:0 18px 50px rgba(69,49,40,.12)}.hero{padding:42px 28px 34px;text-align:center;background:linear-gradient(145deg,rgba(255,248,246,.98),rgba(250,237,231,.95))}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-dark);margin-bottom:10px}h1{font-family:"Playfair Display",serif;font-size:clamp(32px,8vw,48px);line-height:1.05;margin:0 0 16px}.message{margin:0 auto;max-width:430px;line-height:1.6;color:var(--muted)}.details{display:grid;gap:10px;margin-top:26px}.detail{background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:15px;padding:13px 15px;text-align:left}.detail strong{display:block;font-size:13px}.detail span{color:var(--muted);font-size:14px}.form{padding:30px 28px 34px}.welcome{margin:0 0 24px;font-size:18px}.welcome strong{color:var(--accent-dark)}label{display:block;font-size:14px;font-weight:700;margin:20px 0 9px}.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{position:relative}.choice input{position:absolute;opacity:0;pointer-events:none}.choice span{display:block;padding:15px;text-align:center;border:1px solid var(--line);border-radius:14px;cursor:pointer;background:#fff}.choice input:checked+span{border-color:var(--accent);background:#fff3f4;box-shadow:0 0 0 2px rgba(185,111,123,.12)}.counter{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:14px;padding:8px;background:#fff}.counter button{border:0;background:#f4e8e5;width:42px;height:42px;border-radius:12px;font-size:22px;cursor:pointer;color:var(--accent-dark)}.counter strong{font-size:20px}textarea{width:100%;resize:vertical;min-height:90px;border:1px solid var(--line);border-radius:14px;padding:13px;font:inherit;outline:none}textarea:focus{border-color:var(--accent)}.submit{width:100%;border:0;border-radius:15px;padding:16px;margin-top:25px;background:var(--accent);color:#fff;font:inherit;font-weight:700;cursor:pointer}.submit:disabled{opacity:.6;cursor:wait}.error{background:#fff0f0;border:1px solid #f0cccc;color:#8b3f3f;padding:15px;border-radius:14px;line-height:1.5}.success{text-align:center;padding:20px 5px 10px}.success-icon{font-size:58px;margin-bottom:10px}.success h2{font-family:"Playfair Display",serif;font-size:34px;margin:0 0 12px}.success p{color:var(--muted);line-height:1.6}.small{color:var(--muted);font-size:12px;text-align:center;margin-top:18px}.hidden{display:none!important}@media(max-width:430px){.hero,.form{padding-left:20px;padding-right:20px}.choice-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="page"><div class="card">
<section class="hero">
<div class="eyebrow">Você é nosso convidado</div>
<h1 id="eventName">Carregando...</h1>
<p class="message" id="eventMessage"></p>
<div class="details">
<div class="detail"><strong>📅 Data</strong><span id="eventDate">—</span></div>
<div class="detail"><strong>🕐 Horário</strong><span id="eventTime">—</span></div>
<div class="detail"><strong>📍 Local</strong><span id="eventLocation">—</span><span id="eventAddress"></span></div>
</div>
</section>
<section class="form">
<div id="loading">Carregando seu convite...</div>
<div id="error" class="error hidden"></div>
<div id="formContent" class="hidden">
<p class="welcome">Olá, <strong id="guestName"></strong>! ❤️</p>
<label>Você poderá comparecer?</label>
<div class="choice-grid">
<label class="choice"><input type="radio" name="presence" value="SIM" checked><span>🎉 Sim, estarei lá!</span></label>
<label class="choice"><input type="radio" name="presence" value="NAO"><span>😢 Não poderei ir</span></label>
</div>
<div id="companionsBlock">
<label>Quantos acompanhantes virão com você?</label>
<div class="counter"><button type="button" onclick="changeCompanions(-1)">−</button><strong id="companionsValue">0</strong><button type="button" onclick="changeCompanions(1)">+</button></div>
</div>
<label for="notes">Alguma observação? <span style="font-weight:400;color:#999">(opcional)</span></label>
<textarea id="notes" maxlength="500" placeholder="Ex.: preciso de espaço para carrinho de bebê..."></textarea>
<button class="submit" id="submitBtn" onclick="submitRsvp()">Confirmar presença</button>
<p class="small">Sua resposta pode ser alterada depois usando o mesmo link.</p>
</div>
<div id="success" class="success hidden">
<div class="success-icon">🎉</div><h2>Tudo certo!</h2><p id="successText"></p><p>Estamos muito felizes em poder contar com você. ❤️</p>
</div>
</section>
</div></div>

<script>
/*
 * IMPORTANTE:
 * Depois de publicar o backend, coloque aqui a URL /exec.
 * Exemplo:
 * https://script.google.com/macros/s/AKfy.../exec
 */
const PUBLIC_API_URL = 'https://script.google.com/macros/s/AKfycbwH_dvHHQNQMqjuKXGi6aiIAI38IElRfaaKH60RVHbp58LZS0lEqUKD_8QLPFnutgf5CQ/exec';
const TOKEN = new URLSearchParams(location.search).get('token') || '';

let maxCompanions=0, companions=0;

function showError(msg){
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('formContent').classList.add('hidden');
  const e=document.getElementById('error'); e.textContent=msg; e.classList.remove('hidden');
}

function jsonp(params){
  return new Promise((resolve,reject)=>{
    const cb='rsvpCallback_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const script=document.createElement('script');
    const query=new URLSearchParams({...params,callback:cb});
    const timer=setTimeout(()=>{cleanup();reject(new Error('Tempo esgotado'));},15000);
    function cleanup(){clearTimeout(timer);delete window[cb];script.remove();}
    window[cb]=(data)=>{cleanup();resolve(data)};
    script.onerror=()=>{cleanup();reject(new Error('Falha de conexão'))};
    script.src=PUBLIC_API_URL+'?'+query.toString();
    document.body.appendChild(script);
  });
}

async function loadGuest(){
  if(PUBLIC_API_URL.includes('COLE_AQUI')) return showError('O endereço do sistema ainda não foi configurado.');
  if(!TOKEN) return showError('Este link não contém um convite válido.');
  try{
    const data=await jsonp({action:'getGuest',token:TOKEN});
    if(!data.ok) return showError(data.message||'Convite não encontrado.');
    const c=data.config||{};
    document.getElementById('eventName').textContent=c.eventName||'Aniversário';
    document.getElementById('eventMessage').textContent=c.eventMessage||'';
    document.getElementById('eventDate').textContent=c.eventDate||'—';
    document.getElementById('eventTime').textContent=c.eventTime||'—';
    document.getElementById('eventLocation').textContent=c.eventLocation||'—';
    document.getElementById('eventAddress').textContent=c.eventAddress?' '+c.eventAddress:'';
    document.getElementById('guestName').textContent=data.name||'';
    maxCompanions=Number(c.maxCompanions||0);
    document.querySelector('input[value="NAO"]').checked=data.currentPresence==='Não';
    document.querySelector('input[value="SIM"]').checked=data.currentPresence!=='Não';
    companions=Math.min(Number(data.currentCompanions||0),maxCompanions);
    updateCompanions();
    document.getElementById('notes').value=data.currentNotes||'';
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('formContent').classList.remove('hidden');
    document.querySelectorAll('input[name="presence"]').forEach(i=>i.addEventListener('change',updatePresence));
    updatePresence();
  }catch(e){showError('Não foi possível carregar o convite. Verifique sua conexão e tente novamente.');}
}

function updatePresence(){
  const yes=document.querySelector('input[name="presence"]:checked')?.value==='SIM';
  document.getElementById('companionsBlock').classList.toggle('hidden',!yes);
}
function updateCompanions(){document.getElementById('companionsValue').textContent=companions}
function changeCompanions(d){companions=Math.max(0,Math.min(maxCompanions,companions+d));updateCompanions()}

async function submitRsvp(){
  const btn=document.getElementById('submitBtn');
  btn.disabled=true;btn.textContent='Salvando...';
  try{
    const data=await jsonp({
      action:'submitRsvp',
      token:TOKEN,
      presence:document.querySelector('input[name="presence"]:checked')?.value||'SIM',
      companions:String(companions),
      notes:document.getElementById('notes').value
    });
    if(!data.ok) throw new Error(data.message||'Não foi possível salvar.');
    document.getElementById('formContent').classList.add('hidden');
    document.getElementById('success').classList.remove('hidden');
    document.getElementById('successText').textContent=data.presence==='Sim'
      ? `Presença confirmada, ${data.name}!${data.companions>0?` Registramos também ${data.companions} acompanhante(s).`:''}`
      : `Tudo bem, ${data.name}. Registramos que você não poderá comparecer.`;
  }catch(e){
    btn.disabled=false;btn.textContent='Confirmar presença';
    alert(e.message||'Não foi possível salvar sua resposta.');
  }
}
loadGuest();
</script>
</body>
</html>
